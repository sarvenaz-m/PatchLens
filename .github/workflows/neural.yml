name: Optional neural integration checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tiny-local-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[train]'
      - run: python -m unittest discover -s tests -p test_hf.py -v
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
